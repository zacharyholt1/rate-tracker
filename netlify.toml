[build]
  command = "cp -r data site/data"
  publish = "site"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    # Strict CSP: no inline scripts, no external resources beyond our own origin.
    # 'strict-dynamic' + nonce is added by app.js at runtime for the one trusted
    # script block. External fetches are limited to same-origin data files.
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; img-src 'self' data:; form-action 'none'; frame-ancestors 'none'; base-uri 'self'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
