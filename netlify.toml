[build]
  command = "node scripts/build.mjs"
  publish = "site"
  functions = "netlify/functions"

[build.environment]
  # Pin the Functions/build runtime so .mjs ESM is handled consistently.
  NODE_VERSION = "20"

[functions]
  # Force the modern ESM-aware bundler. Without this (and without a
  # package.json "type": "module"), Netlify has to GUESS how to treat .mjs,
  # and a wrong guess makes the bundled function throw at import time — a 502
  # with no log that no in-handler code change can fix.
  node_bundler = "esbuild"
  # Bundle the gated data with the functions so leaderboard.mjs can read it.
  # rollups.json is served ONLY from the function, never as a static file.
  included_files = ["data/rollups.json", "data/forecasters.json"]

[[headers]]
  for = "/*"
  [headers.values]
    # Strict CSP. Scripts/styles same-origin only; the one external connection
    # allowed is to Supabase (auth + REST) over https.
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self' https://*.supabase.co; img-src 'self' data:; form-action 'none'; frame-ancestors 'none'; base-uri 'self'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
