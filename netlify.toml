[build]
  command = "node scripts/build.mjs"
  publish = "site"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  # Use the default zip-it-and-ship-it bundler (NOT esbuild).
  # esbuild transpiles ESM -> CJS for the Lambda runtime, and its polyfill for
  # import.meta.url can fail at module-load time (silent 502, "No log").
  # With Node 20 + "type":"module" in package.json, zip-it-and-ship-it ships
  # .mjs files unchanged and Node handles native ESM directly -- no polyfills,
  # no transformation, no surprises.
  included_files = ["data/rollups.json", "data/forecasters.json"]

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self' https://*.supabase.co; img-src 'self' data:; form-action 'none'; frame-ancestors 'none'; base-uri 'self'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
