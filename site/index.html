<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rate Tracker</title>
  <meta name="description" content="Track central bank rate decisions, economic indicators, and economist forecast accuracy for the US Fed and Australia's RBA." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%F0%9F%93%88%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
  <!-- No external resources. Everything is same-origin. -->
</head>
<body>

<header class="app-header">
  <div class="wordmark">Rate<span>Tracker</span></div>

  <nav class="nav-tabs" aria-label="Region">
    <button class="nav-tab active" data-country="ALL">All</button>
    <button class="nav-tab" data-country="US">🇺🇸 Fed</button>
    <button class="nav-tab" data-country="AU">🇦🇺 RBA</button>
  </nav>

  <button id="submit-source-btn" class="leaderboard-link" type="button">
    + Submit a source
  </button>
  <a class="leaderboard-link" href="leaderboard.html">
    Leaderboard <span aria-hidden="true">→</span>
  </a>
</header>

<main>
  <div id="filter-bar" class="filters" aria-label="Filters">
    <span class="filter-label">Show</span>
    <div class="filter-group" role="group" aria-label="Event type">
      <button class="filter-btn active" data-type="decisions">Decisions</button>
      <button class="filter-btn active" data-type="paths">Path forecasts</button>
      <button class="filter-btn active" data-type="indicators">Inflation &amp; jobs forecasts</button>
    </div>
  </div>

  <div id="timeline" class="timeline" role="feed" aria-busy="true" aria-label="Rate decision timeline">
    <div class="state-message" id="loading">
      <div class="spinner" aria-hidden="true"></div>
      Loading…
    </div>
  </div>
</main>

<!-- Submit-a-source modal (gated on sign-in). -->
<div id="submit-modal" class="modal-overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="submit-title">
    <h2 id="submit-title">Submit a source</h2>
    <p class="modal-sub">Spotted a decision or forecast our scrapers missed?
      Paste the URL. It must be from a trusted domain (RBA, Fed, FRED, ABS,
      Reuters, AFR, WSJ, Bloomberg) and will be reviewed before going live.</p>
    <form id="submit-form">
      <input id="submit-url" type="url" placeholder="https://www.rba.gov.au/…"
             required autocomplete="off" spellcheck="false" />
      <div id="submit-status" class="submit-status" role="status"></div>
      <div class="modal-actions">
        <button type="button" id="submit-cancel" class="btn-ghost">Cancel</button>
        <button type="submit" id="submit-go" class="btn-primary">Submit</button>
      </div>
    </form>
  </div>
</div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>
</body>
</html>
